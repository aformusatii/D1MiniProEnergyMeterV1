; D1MiniProEnergyMeterV1 - LOLIN (WEMOS) D1 mini + PZEM-004T v3.0 energy meter
; Migrated from the Eclipse Sloeber project (esp8266 core 3.0.2, "LOLIN(WEMOS) D1 mini (clone)").
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini

[env]
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini

; --- Board settings, matching the original Sloeber/Arduino IDE menu ---
; CPU 80 MHz (board default)
board_build.f_cpu = 80000000L
; Flash: 4MB, no filesystem (OTA ~1019KB), 40 MHz, DIO
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m.ld

build_flags =
    ; lwIP v2 Lower Memory (Sloeber: ip=lm2f) - also the PlatformIO default, stated explicitly
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

lib_deps =
    bblanchon/ArduinoJson@7.2.0
    ; v1.2.1 is not published to the PlatformIO registry (latest there is 1.1.2)
    https://github.com/mandulaj/PZEM-004T-v30.git#v1.2.1

monitor_speed = 115200

; Serial flashing (on-board USB-UART)
[env:d1_mini]
upload_port = COM5
upload_speed = 115200

; OTA flashing through the built-in /update web page (ESP8266HTTPUpdateServer)
;   pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
upload_protocol = custom
custom_ota_url = http://192.168.100.21/update
extra_scripts = scripts/ota_upload.py
; refuse to build OTA firmware with placeholder WiFi credentials (device would be unreachable)
build_flags =
    ${env.build_flags}
    -DREQUIRE_WIFI_CONFIG
